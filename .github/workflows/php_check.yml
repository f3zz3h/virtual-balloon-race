name: PHP Checker
run-name: ${{ github.actor }} is testing out GitHub Actions 🚀
on: [push]
jobs:
  Explore-GitHub-Actions:
    runs-on: ubuntu-latest
    steps:
      - run: echo "🎉 The job was automatically triggered by a ${{ github.event_name }} event."
      - run: echo "🐧 This job is now running on a ${{ runner.os }} server hosted by GitHub!"
      - run: echo "🔎 The name of your branch is ${{ github.ref }} and your repository is ${{ github.repository }}."
      - name: Check out repository code
        uses: actions/checkout@v6
      - name: Check PHP syntax errors
      # You may pin to the exact commit or the version.
      # uses: overtrue/phplint@540dff330004054776a5873b081b170dc32f9e17
        uses: overtrue/phplint@6.0.0
        with:
          # path to check
          path: # optional, default is .
          # command options.(eg: --no-cache --exclude=*.log)
          options: # optional, default is
      - name: WPCS Checker
        # You may pin to the exact commit or the version.
        # uses: arraystory/action-wpcs@9045bb523f173750aaa52ed08b7f0f932ee4a23b
        uses: arraystory/action-wpcs@v1
        with:
          # PHP version to use
          php_version: # optional, default is 8.2
          # Plugin/theme text domain
          text_domain: 
          # Function/class prefixes (comma-separated)
          prefixes: # optional, default is 
          # Minimum PHP version for compatibility checks
          minimum_php: # optional, default is 7.4
          # Paths to scan
          paths: # optional, default is .
          # Paths to ignore (comma-separated)
          ignore: # optional, default is vendor,node_modules,assets
      #- run: echo "💡 The ${{ github.repository }} repository has been cloned to the runner."
      #- run: echo "🖥️ The workflow is now ready to test your code on the runner."
      #- name: List files in the repository
      #  run: |
      #    ls ${{ github.workspace }}
      - run: echo "🍏 This job's status is ${{ job.status }}."
